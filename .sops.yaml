creation_rules:
  - path_regex: ^hosts/vmnixos/secrets/[^/]+$
    key_groups:
      - age:
          - *admin_fython
          - *vmnixos

  - path_regex: ^hosts/MacBook-Pro-2/secrets/[^/]+$
    key_groups:
      - age:
          - *admin_fython
          - *macbook_pro_2

  - path_regex: ^hosts/FMac23/secrets/[^/]+$
    key_groups:
      - age:
          - *admin_fython
          - *fmac23

  # Shared modules use one scope directory and the common recipient set below.
  # JSONC and TOML files should normally be handled as whole-file binary secrets.
  - path_regex: ^modules/public/secrets/[^/]+/[^/]+\.(yaml|jsonc|json|ini|toml)$
    key_groups:
      - age:
          - *admin_fython
          - *vmnixos
          - *macbook_pro_2
          - *fmac23
